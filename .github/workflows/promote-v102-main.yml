name: Finalize Conciliador v10.2

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: github.event.issue.title == 'release-v10.2-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch tested payload and verify
        shell: bash
        run: |
          git fetch origin agent/motor-confiavel-observacoes
          git show origin/agent/motor-confiavel-observacoes:.release/v10.2/part-00.b64 > /tmp/index.html.gz.b64
          git show origin/agent/motor-confiavel-observacoes:.release/v10.2/part-01.b64 >> /tmp/index.html.gz.b64
          git show origin/agent/motor-confiavel-observacoes:.release/v10.2/part-02.b64 >> /tmp/index.html.gz.b64
          base64 --decode /tmp/index.html.gz.b64 | gzip --decompress > /tmp/index.html
          echo 'aa91ee4be5a62fc2fcd79079c502a52ca4271deabc7048576cbae3d7e2a3f773  /tmp/index.html' | sha256sum --check --strict
          grep -q 'Conciliador de Estoque PRO v10.2' /tmp/index.html

      - name: Commit tested v10.2 and clean publisher
        shell: bash
        run: |
          cp /tmp/index.html index.html
          git rm .github/workflows/promote-v102-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'release: promove conciliador v10.2'
          git push origin main

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment 'v10.2 publicada na main.'
